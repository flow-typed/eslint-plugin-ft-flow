name: Publish

on:
  release:
    types: [created]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - run: corepack enable
      - run: yarn

      - uses: JS-DevTools/npm-publish@v4
        with:
          token: ${{secrets.NPM_TOKEN}}
