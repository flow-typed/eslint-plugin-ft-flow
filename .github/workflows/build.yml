name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version:
          - 22
          - 24
        eslint-version:
          - 8
          - 9
          - 10
    name: node=${{ matrix.node-version }}, eslint=${{ matrix.eslint-version }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - run: corepack enable
    - run: yarn
    - run: yarn add --dev eslint@${{ matrix.eslint-version }}

    - run: yarn check-docs
    - run: yarn check-tests
    - run: yarn lint
    - run: yarn test
    - run: yarn build
