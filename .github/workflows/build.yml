name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version:
          - 20
        eslint-version:
          - 8
          - 9
    name: Node.js ${{ matrix.node-version }} with ESLint ${{ matrix.eslint-version }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}

    - uses: CultureHQ/actions-yarn@v1.0.1

    - run: yarn
    - run: yarn add --dev eslint@${{ matrix.eslint-version }}

    - run: yarn check-docs
    - run: yarn check-tests
    - run: yarn lint
    - run: yarn test
    - run: yarn build
